# Fork-only: builds the tastyrice codex binary on GitHub instead of the production host.
# Every push to `tastyrice` builds a release binary in rust:1.95-bookworm (same glibc as the
# node:24-slim agent image), runs the tests of the crates this fork changes, and publishes the
# stripped binary as release `tastyrice-<short sha>`. my-blog's scripts/agent-sandbox/codex-fetch.sh
# downloads it, checks the sha256 and builds the agent image. The same release carries the
# user-installed client: `onigio-agent-x86_64-unknown-linux-gnu.tar.gz` (the same binary, renamed)
# and `onigio-agent-x86_64-pc-windows-msvc.zip` (onigio-agent.exe plus the Windows sandbox helpers,
# which it finds beside itself under their fixed names).
name: tastyrice-build

on:
  push:
    branches: [tastyrice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tastyrice-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_IMAGE: rust:1.95-bookworm
  # Same profile as the production build: thin LTO needs more memory than a runner has.
  CARGO_ENV: >-
    -e CARGO_NET_GIT_FETCH_WITH_CLI=true -e CARGO_INCREMENTAL=0
    -e CARGO_PROFILE_RELEASE_LTO=false -e CARGO_PROFILE_RELEASE_DEBUG=0
    -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 -e CARGO_TARGET_DIR=/target -e RUSTUP_TOOLCHAIN=1.95.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/cargo-registry
            ~/cargo-git
            ~/target
          key: release-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: release-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      - name: Build codex
        run: bash .github/tastyrice/in-rust-container.sh "cargo build --release --locked -p codex-cli --bin codex"
      - name: Package
        run: |
          mkdir dist
          cp ~/target/release/codex dist/codex
          strip dist/codex
          ./dist/codex --version
          tar -C dist -czf codex-x86_64-unknown-linux-gnu.tar.gz codex
          sha256sum codex-x86_64-unknown-linux-gnu.tar.gz > codex-x86_64-unknown-linux-gnu.tar.gz.sha256
          mkdir branded
          cp dist/codex branded/onigio-agent
          ./branded/onigio-agent --help > branded-help.txt
          head -1 branded-help.txt | grep -q '^Onigio agent'
          grep -q '^Usage: onigio-agent \[OPTIONS\]' branded-help.txt
          tar -C branded -czf onigio-agent-x86_64-unknown-linux-gnu.tar.gz onigio-agent
          sha256sum onigio-agent-x86_64-unknown-linux-gnu.tar.gz > onigio-agent-x86_64-unknown-linux-gnu.tar.gz.sha256
          df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: codex
          path: |
            codex-x86_64-unknown-linux-gnu.tar.gz*
            onigio-agent-x86_64-unknown-linux-gnu.tar.gz*
          retention-days: 7

  # GitHub-hosted runner (no private runners, no signing). Setup steps follow upstream's
  # rust-release-windows.yml: MSVC developer environment and the checksummed rusty_v8 artifacts.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: codex-rs
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: windows-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      - name: Build onigio-agent and the sandbox helpers
        run: |
          cargo build --target "$TARGET" --release --locked -p codex-cli --bin codex \
            -p codex-windows-sandbox --bin codex-command-runner --bin codex-windows-sandbox-setup
      - name: Package
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $release = Join-Path $env:CARGO_TARGET_DIR "$env:TARGET/release"
          $stage = New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item (Join-Path $release 'codex.exe') (Join-Path $stage 'onigio-agent.exe')
          Copy-Item (Join-Path $release 'codex-command-runner.exe') $stage
          Copy-Item (Join-Path $release 'codex-windows-sandbox-setup.exe') $stage
          & (Join-Path $stage 'onigio-agent.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'onigio-agent.exe --version failed' }
          $zip = 'onigio-agent-x86_64-pc-windows-msvc.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n")
      - uses: actions/upload-artifact@v4
        with:
          name: onigio-agent-windows
          path: onigio-agent-x86_64-pc-windows-msvc.zip*
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    # A cold cache took more than 150 min in run 42289835783 and more than 300 min in 42316298652 /
    # 42314213049. actions/cache saves only when the job succeeds, so a timed-out run never warmed it
    # for the next one: the cache is now restored and saved in separate steps, and saved even when the
    # tests time out (the test step stops at 270 min so the save still runs inside the job's 300).
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
      - uses: actions/checkout@v4
      - id: test-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/cargo-registry
            ~/cargo-git
            ~/target
          key: test-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: test-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      # Crates this fork changes. Without debug assertions codex refuses to put its helper binaries
      # under the temp dir that the integration tests use as CODEX_HOME. codex-http-client runs only
      # the fork's client_builder tests: its route_aware TLS-fallback tests also fail at the upstream
      # merge base when the crate is tested on its own (checked 2026-11-06 at b334d5b3f2).
      # codex-model-provider and codex-login run single-threaded: their encrypted-secrets tests fail
      # when the `age` scrypt work estimate (measured under parallel tests on a 4-core runner) exceeds
      # its limit ("failed to decrypt secrets file", which gateway_auth reports as "failed to load
      # provider OAuth credentials"). codex-login passed in run 42181068758 and four of its
      # secrets-backed tests failed in run 42218297229 with identical login/secrets code.
      # Every command runs; the step fails at the end if any of them failed.
      # server_api's response_body_timeout_is_transient fails at the fork's pre-remote-control-patch
      # commit too (3b3a1c527c, local run 2026-11-06): not caused by the site relay patch.
      # Six unified_exec tests exercise codex's own sandbox (bubblewrap, fs-sandbox helper, network
      # denial). They fail inside a container even with user namespaces and seccomp/AppArmor
      # unconfined (2026-11-06 runs 42082907854, 42093638206), and two of them failed the same way at
      # the upstream code in the production build container. The agent image runs codex with
      # danger-full-access inside its own gVisor container, so that sandbox is never used.
      - name: Test changed crates
        timeout-minutes: 270
        run: |
          bash .github/tastyrice/in-rust-container.sh "export CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true
            failed=()
            run() { echo \"::group::\$*\"; cargo test --release --locked \"\$@\" || failed+=(\"\$*\"); echo ::endgroup::; }
            run -p codex-api -p codex-config -p codex-model-provider-info -p codex-models-manager -p codex-protocol
            run -p codex-login -- --test-threads=1
            run -p codex-model-provider -- --test-threads=1
            run -p codex-http-client --lib client_builder
            run -p codex-app-server-transport --lib transport::remote_control -- \\
              --skip transport::remote_control::server_api::tests::response_body_timeout_is_transient
            run -p codex-cli --bin codex -- site_login site_password host_info brand remote_control allow_defaults
            run -p codex-cli --test site_account_names
            run -p codex-core --lib site_account_provider
            run -p codex-app-server --lib remote_roots
            run -p codex-app-server --lib remote_threads
            run -p codex-app-server --test all suite::v2::fs::
            run -p codex-app-server-protocol
            run -p codex-file-search --lib text_search
            run -p codex-app-server-daemon --lib remote_control_folders
            run -p codex-app-server-transport --lib remote_allowed_roots
            run -p codex-core --lib unified_exec
            run -p codex-core --test all suite::unified_exec -- \\
              --skip suite::unified_exec::unified_exec_enforces_glob_deny_read_policy \\
              --skip suite::unified_exec::unified_exec_network_denial_emits_failed_background_end_event \\
              --skip suite::unified_exec::unified_exec_short_lived_network_denial_emits_failed_end_event \\
              --skip suite::unified_exec::unified_exec_runs_under_sandbox \\
              --skip suite::unified_exec_stdin_approval::strict_stdin_review_reaches_guardian_with_sandbox_prompts_disabled \\
              --skip suite::unified_exec_stdin_approval::stdin_reviews_retained_grants_after_turn_permissions_expire
            if ((\${#failed[@]})); then printf 'FAILED: %s\n' \"\${failed[@]}\"; exit 1; fi"
      - name: Save the test cache (also after a failure or a timeout)
        if: always() && steps.test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/cargo-registry
            ~/cargo-git
            ~/target
          key: test-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.sha }}

  release:
    needs: [build, build-windows, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codex
      - uses: actions/download-artifact@v4
        with:
          name: onigio-agent-windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="tastyrice-${GITHUB_SHA::12}"
          assets=(codex-x86_64-unknown-linux-gnu.tar.gz* onigio-agent-x86_64-unknown-linux-gnu.tar.gz*
            onigio-agent-x86_64-pc-windows-msvc.zip*)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
              --prerelease --title "$tag" --notes "tastyrice build of ${GITHUB_SHA}"
          fi
