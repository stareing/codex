# Fork-only: builds the tastyrice codex binary on GitHub instead of the production host.
# Every push to `tastyrice` builds a release binary in rust:1.95-bookworm (same glibc as the
# node:24-slim agent image), runs the tests of the crates this fork changes, and publishes the
# stripped binary as release `tastyrice-<short sha>`. my-blog's scripts/agent-sandbox/codex-fetch.sh
# downloads it, checks the sha256 and builds the agent image.
name: tastyrice-build

on:
  push:
    branches: [tastyrice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tastyrice-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_IMAGE: rust:1.95-bookworm
  # Same profile as the production build: thin LTO needs more memory than a runner has.
  CARGO_ENV: >-
    -e CARGO_NET_GIT_FETCH_WITH_CLI=true -e CARGO_INCREMENTAL=0
    -e CARGO_PROFILE_RELEASE_LTO=false -e CARGO_PROFILE_RELEASE_DEBUG=0
    -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 -e CARGO_TARGET_DIR=/target -e RUSTUP_TOOLCHAIN=1.95.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/cargo-registry
            ~/cargo-git
            ~/target
          key: release-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: release-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      - name: Build codex
        run: bash .github/tastyrice/in-rust-container.sh "cargo build --release --locked -p codex-cli --bin codex"
      - name: Package
        run: |
          mkdir dist
          cp ~/target/release/codex dist/codex
          strip dist/codex
          ./dist/codex --version
          tar -C dist -czf codex-x86_64-unknown-linux-gnu.tar.gz codex
          sha256sum codex-x86_64-unknown-linux-gnu.tar.gz > codex-x86_64-unknown-linux-gnu.tar.gz.sha256
          df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: codex
          path: codex-x86_64-unknown-linux-gnu.tar.gz*
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/cargo-registry
            ~/cargo-git
            ~/target
          key: test-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: test-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      # Crates this fork changes. Without debug assertions codex refuses to put its helper binaries
      # under the temp dir that the integration tests use as CODEX_HOME. codex-http-client runs only
      # the fork's client_builder tests: its route_aware TLS-fallback tests also fail at the upstream
      # merge base when the crate is tested on its own (checked 2026-11-06 at b334d5b3f2).
      # codex-model-provider runs single-threaded: its encrypted-secrets test fails when the `age`
      # scrypt work estimate (measured under parallel tests on a 4-core runner) exceeds its limit.
      # Every command runs; the step fails at the end if any of them failed.
      # Six unified_exec tests exercise codex's own sandbox (bubblewrap, fs-sandbox helper, network
      # denial). They fail inside a container even with user namespaces and seccomp/AppArmor
      # unconfined (2026-11-06 runs 42082907854, 42093638206), and two of them failed the same way at
      # the upstream code in the production build container. The agent image runs codex with
      # danger-full-access inside its own gVisor container, so that sandbox is never used.
      - name: Test changed crates
        run: |
          bash .github/tastyrice/in-rust-container.sh "export CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true
            failed=()
            run() { echo \"::group::\$*\"; cargo test --release --locked \"\$@\" || failed+=(\"\$*\"); echo ::endgroup::; }
            run -p codex-api -p codex-config -p codex-login -p codex-model-provider-info -p codex-models-manager -p codex-protocol
            run -p codex-model-provider -- --test-threads=1
            run -p codex-http-client --lib client_builder
            run -p codex-app-server-transport --lib transport::remote_control
            run -p codex-core --lib unified_exec
            run -p codex-core --test all suite::unified_exec -- \\
              --skip suite::unified_exec::unified_exec_enforces_glob_deny_read_policy \\
              --skip suite::unified_exec::unified_exec_network_denial_emits_failed_background_end_event \\
              --skip suite::unified_exec::unified_exec_short_lived_network_denial_emits_failed_end_event \\
              --skip suite::unified_exec::unified_exec_runs_under_sandbox \\
              --skip suite::unified_exec_stdin_approval::strict_stdin_review_reaches_guardian_with_sandbox_prompts_disabled \\
              --skip suite::unified_exec_stdin_approval::stdin_reviews_retained_grants_after_turn_permissions_expire
            if ((\${#failed[@]})); then printf 'FAILED: %s\n' \"\${failed[@]}\"; exit 1; fi"

  release:
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codex
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="tastyrice-${GITHUB_SHA::12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" codex-x86_64-unknown-linux-gnu.tar.gz* --clobber
          else
            gh release create "$tag" codex-x86_64-unknown-linux-gnu.tar.gz* --target "$GITHUB_SHA" \
              --prerelease --title "$tag" --notes "tastyrice build of ${GITHUB_SHA}"
          fi
