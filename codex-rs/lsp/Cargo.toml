[package]
edition.workspace = true
license.workspace = true
name = "codex-lsp"
version.workspace = true

[lib]
name = "codex_lsp"
path = "src/lib.rs"
doctest = false

# Fake language server used by this crate's integration tests only.
[[bin]]
name = "test_lsp_server"
path = "src/bin/test_lsp_server.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
codex-utils-process = { workspace = true }
codex-utils-pty = { workspace = true }
indexmap = { workspace = true }
lru = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
